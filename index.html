<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2ed"><title>Little Journal Wheel</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#393344;background:#f7f2ed}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#fffaf4,#f7f2ed 65%)}main{max-width:540px;margin:auto;padding:24px 18px 46px;text-align:center}h1{font-family:Georgia,serif;font-size:2.05rem;font-weight:500;margin:8px 0 6px}.sub{color:#776f79;margin:0 0 22px;font-size:.94rem}.wheel-wrap{position:relative;width:min(88vw,370px);aspect-ratio:1;margin:0 auto 20px}.wheel{width:100%;height:100%;filter:drop-shadow(0 10px 16px #6e5b6a22);transition:transform 4.6s cubic-bezier(.15,.75,.14,1)}.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:27px solid #51445e;filter:drop-shadow(0 2px 2px #0002)}button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 24px;font-weight:650}.primary{background:#574665;color:white;min-width:210px;box-shadow:0 4px 12px #4d385a2b}.primary:disabled{opacity:.6}.secondary{background:#eee7ed;color:#4c3e56}.result{margin:22px auto 0;background:#fffdfb;border:1px solid #e8e0e5;border-radius:24px;padding:22px 20px;min-height:156px;box-shadow:0 6px 22px #6a536010}.category{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:750;color:#8d718f}.question{font-family:Georgia,serif;font-size:1.46rem;line-height:1.4;margin:12px 0 2px}.small{font-size:.8rem;color:#857a83}.timer{margin:22px auto 0;display:flex;flex-direction:column;align-items:center;gap:12px}.timer-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}.timer-display{font-variant-numeric:tabular-nums;font-size:1.55rem;font-weight:700;min-width:76px}.chip{padding:9px 13px;background:#eee7ed;color:#5a4c62}.chip.active{background:#d9c5db}.footer{font-size:.76rem;color:#897e85;margin:22px 0}.hide{display:none}button:focus-visible{outline:3px solid #ae86c7;outline-offset:3px}@media(prefers-reduced-motion:reduce){.wheel{transition-duration:.01s}}
</style></head><body><main><h1>Little Journal Wheel ✨</h1><p class="sub">One little question. A few minutes on paper.</p><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><svg id="wheel" class="wheel" viewBox="0 0 400 400" role="img" aria-label="Wheel with nine journal prompt categories"></svg></div><button id="spin" class="primary">✦ Spin the wheel</button><section class="result" aria-live="polite"><div id="category" class="category">Your next reflection</div><p id="question" class="question">Spin the wheel to discover a question.</p></section><section class="timer"><div class="small">Optional writing timer</div><div class="timer-row"><button class="chip active" data-min="3">3 min</button><button class="chip" data-min="5">5 min</button><span class="timer-display" id="clock">03:00</span><button id="timerButton" class="secondary">Start</button><button id="reset" class="secondary" aria-label="Reset timer">↺</button></div><div class="small" id="timerNote">Take your time. The timer won't interrupt you.</div></section><p class="footer">No accounts, no tracking, no streaks. Every spin is a fresh chance.</p></main><script>
const groups=[
{name:'Everyday Life',short:['Everyday','Life'],color:'#e9b9a7',q:['What tiny detail made today different from yesterday?','When did you feel most at ease today?','What ordinary routine secretly brings you joy?','What has been taking up most of your attention lately?','What is one thing you would like to do more slowly?','Which part of your day felt most like yours?','What sound, smell, or sight would capture today?','What would make tomorrow a little gentler?','What did you notice today that you usually overlook?','What small decision improved your day?','Where did your mind wander when you had a quiet moment?','What does a good ordinary day look like to you?']},
{name:'Memories',short:['Memories'],color:'#eacb90',q:['What childhood place do you remember most vividly?','Which meal instantly takes you back in time?','What is a small kindness you still remember?','Which old friendship shaped who you became?','What would you tell your younger self about a difficult year?','What family tradition would you like to preserve?','Which song brings back a particular moment?','What is a memory that makes you laugh unexpectedly?','What did you love doing before you cared whether you were good at it?','What is a moment you wish you could revisit for five minutes?','Which smell reminds you of home?','What have you changed your mind about since childhood?']},
{name:'Self-Discovery',short:['Self','Discovery'],color:'#b9d8c4',q:['When do you feel most like yourself?','What quality in yourself are you learning to appreciate?','What do you need more of right now?','What belief about yourself might be outdated?','Which personal boundary has made your life better?','What do you find easy that others might find difficult?','When are you most curious?','What would you try if nobody were watching?','What drains your energy faster than you expect?','What is one thing you no longer need to prove?','What are you proud of that rarely gets noticed?','What kind of environment helps you thrive?']},
{name:'Feelings',short:['Feelings'],color:'#c6c5e9',q:['Which emotion has visited you most often lately?','What helps you feel safe when life gets noisy?','What feeling have you been avoiding naming?','When did you last feel pleasantly surprised?','What does calm feel like in your body?','What tends to bring out your impatience?','What are you quietly looking forward to?','What do you wish people understood about your mood today?','When did you last feel genuinely relieved?','How do you know when you need a break?','What is something you can forgive yourself for?','What helped you through a recent hard moment?']},
{name:'Relationships',short:['People &','Connection'],color:'#dfbcd6',q:['Who makes you feel comfortable being quiet?','What is a thoughtful gesture you still remember?','How do you like to show someone you care?','What conversation would you like to have more often?','Who taught you something important without realizing it?','What makes you feel truly listened to?','What do you value most in a friendship?','When did you last feel connected to someone?','What is a small way to nurture an important relationship?','Who would you like to thank, and for what?','What have you learned from a disagreement?','What does healthy closeness mean to you?']},
{name:'Gratitude',short:['Gratitude'],color:'#d7dba7',q:['What comfort do you sometimes take for granted?','What is one beautiful thing you saw recently?','Who made your week easier in a small way?','What ability are you grateful to have?','What is your favorite part of where you live?','What small luxury improves an ordinary day?','What made you smile without expecting it?','What piece of advice are you thankful you received?','What part of nature always lifts your spirits?','What challenge taught you something useful?','What is working well in your life right now?','What everyday object are you surprisingly grateful for?']},
{name:'Goals & Dreams',short:['Goals &','Dreams'],color:'#b8d7e4',q:['What would you love to learn just for fun?','What does a satisfying year look like to you?','What dream have you put aside that still matters?','What tiny step could bring you closer to something meaningful?','What would you like to make space for next month?','What is something new you want to experience?','How would you define success without comparing yourself to anyone?','What would you do with an unexpected free afternoon?','Which habit would make your days feel lighter?','What would future you thank you for starting?','What is a goal you are allowed to change?','Where would you go if you could take a spontaneous day trip?']},
{name:'Creativity',short:['Creativity'],color:'#edc4ad',q:['If today had a title, what would it be?','Describe your mood as a landscape.','What would your ideal tiny hideaway look like?','Invent a holiday worth celebrating.','If your week had a soundtrack, what would its opening song feel like?','Write about a door you would love to open.','If you could collect moments in jars, which one would you keep?','Describe a perfect rainy afternoon using five senses.','What would you name a café designed just for you?','If your thoughts were weather, what is the forecast?','Imagine a letter arriving from your future self. What does it say?','What color best describes this season of your life, and why?']},
{name:'Reflection',short:['Weekly','Reflection'],color:'#cdbbdc',q:['What went better than expected this week?','What challenged you recently, and what did it teach you?','What would you like to leave behind from this week?','What deserves a little celebration?','When did you feel most energized recently?','What did you say yes to that mattered?','What did you say no to that helped?','What is one lesson worth carrying into next week?','What unfinished task can you release without guilt?','How have your priorities shifted lately?','What would make next week feel balanced?','What is one thing you want to remember about this season?']}
];
const svg=document.getElementById('wheel'),NS='http://www.w3.org/2000/svg';const el=(tag,attrs)=>{const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n};const cx=200,cy=200,r=190,step=360/groups.length;
groups.forEach((g,i)=>{let a=(-90+i*step)*Math.PI/180,b=(-90+(i+1)*step)*Math.PI/180;let path=el('path',{d:`M ${cx} ${cy} L ${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)} A ${r} ${r} 0 0 1 ${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)} Z`,fill:g.color,stroke:'#fffaf6','stroke-width':3});svg.appendChild(path);let mid=(a+b)/2,x=cx+125*Math.cos(mid),y=cy+125*Math.sin(mid);let t=el('text',{x,y,'text-anchor':'middle','font-size':'13','font-weight':'650',fill:'#41394b',transform:`rotate(${i*step+20},${x},${y})`});g.short.forEach((s,j)=>{let span=el('tspan',{x,dy:j===0?(g.short.length>1?-5:0):16});span.textContent=s;t.appendChild(span)});svg.appendChild(t)});svg.appendChild(el('circle',{cx,cy,r:34,fill:'#fffaf6',stroke:'#e4d8e4','stroke-width':3}));let center=el('text',{x:200,y:206,'text-anchor':'middle','font-size':18,'font-weight':700,fill:'#574665'});center.textContent='✦';svg.appendChild(center);
let rotation=0,busy=false;const spin=document.getElementById('spin');spin.addEventListener('click',()=>{if(busy)return;busy=true;spin.disabled=true;const i=Math.floor(Math.random()*groups.length),g=groups[i],q=g.q[Math.floor(Math.random()*g.q.length)];const target=((360-(i+.5)*step)%360),current=((rotation%360)+360)%360,delta=(target-current+360)%360;rotation+=360*5+delta;svg.style.transform=`rotate(${rotation}deg)`;document.getElementById('category').textContent='Spinning…';document.getElementById('question').textContent='';setTimeout(()=>{document.getElementById('category').textContent=g.name;document.getElementById('question').textContent=q;spin.textContent='↻ Spin again';spin.disabled=false;busy=false},4650)});
let minutes=3,remaining=180,interval=null,endsAt=0;const clock=document.getElementById('clock'),timerButton=document.getElementById('timerButton');function render(){clock.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}function pause(){if(interval){clearInterval(interval);interval=null;timerButton.textContent='Resume'}}function reset(){pause();remaining=minutes*60;render();timerButton.textContent='Start';document.getElementById('timerNote').textContent="Take your time. The timer won't interrupt you."}document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>{minutes=+b.dataset.min;document.querySelectorAll('[data-min]').forEach(c=>c.classList.toggle('active',c===b));reset()}));document.getElementById('reset').addEventListener('click',reset);timerButton.addEventListener('click',()=>{if(interval){remaining=Math.max(0,Math.ceil((endsAt-Date.now())/1000));pause();return}if(remaining===0)reset();endsAt=Date.now()+remaining*1000;timerButton.textContent='Pause';interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((endsAt-Date.now())/1000));render();if(remaining===0){clearInterval(interval);interval=null;timerButton.textContent='Start again';document.getElementById('timerNote').textContent='Time is up — keep writing if you like ♡'}},200)});render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script></body></html>
